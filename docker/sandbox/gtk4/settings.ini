# GTK 4's defaults, for Nautilus: Inter, the window buttons on the left as on
# the other windows, and greyscale antialiasing, which stays clean when a
# viewer scales the screen.
[Settings]
gtk-font-name=Inter 10
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-decoration-layout=close,minimize,maximize:
gtk-hint-font-metrics=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
