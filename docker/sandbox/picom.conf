# The compositor: soft shadows under the windows, and the see-through parts
# of the dock and of the windows' rounded title bars. Nothing animated, since
# every frame is drawn in software and sent to the viewers. xfwm4 composites
# too, but leaves stale patches on the sandbox's display, so picom does it
# instead.
backend = "xrender";
vsync = false;
fading = false;
# The display reports damage the compositor misses, leaving windows and the
# dock half drawn, so it repaints the whole screen each frame.
use-damage = false;

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.5;
shadow-offset-x = -20;
shadow-offset-y = -14;

# The dock draws its own; tooltips sit too close to what they describe; and a
# maximized window fills its space.
shadow-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"window_type = 'tooltip'",
	"_NET_WM_STATE@[*] *= '_MAXIMIZED_'",
	"_GTK_FRAME_EXTENTS@"
];
