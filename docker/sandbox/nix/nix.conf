# Nix for the agents' user alone: no daemon and no build users, since that
# user (uid 1000 on every provider) owns /nix and has no root.
build-users-group =
experimental-features = nix-command flakes
# Nix's build sandbox needs namespaces the agents' user can't make. Packages
# come built from the binary cache, so it only matters for one built here.
sandbox = false
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
# Only the nixpkgs entries in /etc/nix/registry.json, not the global
# registry, which Nix would fetch from a host sandboxes don't reach.
flake-registry =
