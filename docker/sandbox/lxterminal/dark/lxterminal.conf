# The terminal for a desktop started with `--theme dark`: JetBrains Mono on
# the web app's dark ground, with a palette from the wallpaper's bots.
[general]
fontname=JetBrains Mono 11
selchars=-A-Za-z0-9,./?%&#:_
scrollback=10000
bgcolor=rgb(17,18,22)
fgcolor=rgb(220,222,227)
palette_color_0=rgb(29,31,37)
palette_color_1=rgb(244,63,94)
palette_color_2=rgb(34,197,94)
palette_color_3=rgb(234,179,8)
palette_color_4=rgb(107,133,240)
palette_color_5=rgb(168,85,247)
palette_color_6=rgb(20,184,166)
palette_color_7=rgb(201,204,211)
palette_color_8=rgb(74,78,87)
palette_color_9=rgb(251,113,133)
palette_color_10=rgb(74,222,128)
palette_color_11=rgb(250,204,21)
palette_color_12=rgb(174,187,255)
palette_color_13=rgb(192,132,252)
palette_color_14=rgb(56,189,248)
palette_color_15=rgb(236,238,242)
color_preset=Custom
disallowbold=false
boldbright=false
cursorblinks=false
cursorunderline=false
audiblebell=false
visualbell=false
tabpos=top
geometry_columns=96
