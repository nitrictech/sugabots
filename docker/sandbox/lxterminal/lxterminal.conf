# The terminal's defaults, for a user without their own: JetBrains Mono on
# white, with a palette from the wallpaper's bots darkened to read on it.
[general]
fontname=JetBrains Mono 11
selchars=-A-Za-z0-9,./?%&#:_
scrollback=10000
bgcolor=rgb(255,255,255)
fgcolor=rgb(38,40,46)
palette_color_0=rgb(38,40,46)
palette_color_1=rgb(196,45,69)
palette_color_2=rgb(26,127,55)
palette_color_3=rgb(138,90,18)
palette_color_4=rgb(79,91,213)
palette_color_5=rgb(137,62,204)
palette_color_6=rgb(15,118,110)
palette_color_7=rgb(95,100,110)
palette_color_8=rgb(125,131,142)
palette_color_9=rgb(225,29,72)
palette_color_10=rgb(22,163,74)
palette_color_11=rgb(180,123,6)
palette_color_12=rgb(99,102,241)
palette_color_13=rgb(168,85,247)
palette_color_14=rgb(13,148,136)
palette_color_15=rgb(22,23,27)
color_preset=Custom
disallowbold=false
boldbright=false
cursorblinks=false
cursorunderline=false
audiblebell=false
visualbell=false
tabpos=top
geometry_columns=96
geometry_rows=28
hidescrollbar=true
hidemenubar=true
hideclosebutton=false
hidepointer=false
