# GTK's defaults for every user: the Sugabots theme, Inter, and the cursors
# the X server's own are replaced by.
[Settings]
gtk-theme-name=Sugabots
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-font-name=Inter 10
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
