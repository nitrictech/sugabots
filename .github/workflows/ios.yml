name: iOS

# Builds the iOS app whenever it or its generators change. The app builds
# against the generated files it last took, so a change to the web or the API
# doesn't run this; it reaches the app when someone regenerates them, which the
# Native apps workflow checks.

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "apps/codegen/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/codegen/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # The app is written for a newer Swift than macOS 14's Xcode 15 builds;
    # macOS 26's image has Xcode 26 by default.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build for the simulator
        run: >-
          xcodebuild build
          -project apps/ios/Sugabots.xcodeproj
          -scheme Sugabots
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
