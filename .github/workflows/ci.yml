name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each check is a job of its own so they run side by side, and a failure names
# the check that failed.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    # The migrations run against this, and the API's tests then query it, so a
    # migration that does not apply fails CI. Same major as compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sugabots
          POSTGRES_PASSWORD: sugabots
          POSTGRES_DB: sugabots
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://sugabots:sugabots@localhost:5432/sugabots

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Migrate
        run: bun run db:migrate

      - name: Test
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: bun run build

  # The check the main branch's ruleset requires, under the name it had when
  # these ran as one job. `always()` so that it fails, rather than being
  # skipped, when a job it needs fails: a skipped required check passes.
  checks:
    name: Lint, typecheck, test
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The stories run headless, which needs only Chromium's headless shell.
      - name: Install Chromium
        run: bun run --cwd packages/web playwright install --with-deps --only-shell chromium

      - name: Test stories
        run: bun run test:storybook

      - name: Build Storybook
        run: bun run build:storybook
