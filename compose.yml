# Local Postgres for development, and optionally an OpenSandbox server for
# agents' sandboxes. The API and the web app run on the host, where they reload.
#
#   docker compose up -d                      Postgres on 5436, ready to migrate.
#   docker compose --profile sandboxes up -d  ...and OpenSandbox on 8090.
#   bun run db:migrate                        Apply packages/core/drizzle migrations.
#   docker compose down -v                    Throw the data away.
#
# CI uses a service container with the same image and the same DATABASE_URL
# shape, so a migration that applies here applies there.

name: sugabots

services:
  postgres:
    container_name: sugabots_postgres
    # Pinned to a major so local, CI and production agree on behaviour. The
    # schema leans on 18: `uuidv7()` is built in from this release.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sugabots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sugabots}
      POSTGRES_DB: ${POSTGRES_DB:-sugabots}
    ports:
      # 5436 to stay clear of a default Postgres and of sweet's 5435.
      - "127.0.0.1:${POSTGRES_PORT:-5436}:5432"
    restart: unless-stopped
    volumes:
      # Postgres 18 images store data in a major-version subdirectory so
      # `pg_upgrade --link` works without crossing a mount boundary, so the
      # mount goes at /var/lib/postgresql, NOT the /data path 17 and earlier
      # used. An 18 image refuses to start against the old layout.
      - sugabots_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-sugabots} -d ${POSTGRES_DB:-sugabots}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Only with `--profile sandboxes`. It holds the Docker socket, so it can start
  # containers on this machine: that is how it makes sandboxes, and why it is
  # not started unless asked for.
  opensandbox:
    container_name: sugabots_opensandbox
    profiles: [sandboxes]
    image: opensandbox/server:release-1.1.0
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
    configs:
      - source: opensandbox_config
        target: /etc/opensandbox/config.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OPENSANDBOX_PORT:-8090}:8090"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

configs:
  opensandbox_config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8090
      api_key = "${OPENSANDBOX_API_KEY:-development-opensandbox-key}"

      [log]
      level = "INFO"

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.1.0"

      # gVisor, when it is installed and registered with Docker as `runsc`.
      # Commented out, sandboxes share this machine's kernel: choose "container"
      # isolation in the workspace's sandbox settings, which needs
      # SANDBOX_ALLOW_UNISOLATED=true for the API.
      # [secure_runtime]
      # type = "gvisor"
      # docker_runtime = "runsc"

      # Each sandbox gets a sidecar that refuses every host not on its allowlist.
      [egress]
      image = "opensandbox/egress:v1.1.7"
      mode = "dns+nft"
      readiness_timeout_seconds = 30.0

      [docker]
      network_mode = "bridge"
      # Sandboxes' ports are published on Docker's bridge address, which both
      # this container and the API on the host can reach, and nothing outside
      # the machine can. 172.17.0.1 is Docker's default on Linux.
      host_ip = "${OPENSANDBOX_HOST_IP:-172.17.0.1}"
      publish_host = "${OPENSANDBOX_HOST_IP:-172.17.0.1}"
      port_range_min = 40000
      port_range_max = 60000
      drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
      no_new_privileges = true
      pids_limit = 4096

      [ingress]
      mode = "direct"

volumes:
  sugabots_postgres_data:
