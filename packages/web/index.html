<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Sugabots</title>
		<script>
			/*
			 * The theme, before the first paint. Without this, somebody who has
			 * chosen light sees a dark flash on every load. Choosing nothing is the
			 * common case and needs no script: the stylesheet is dark on its own.
			 */
			try {
				const chosen = localStorage.getItem("sugabots-theme");
				if (chosen === "light" || chosen === "system") {
					document.documentElement.dataset.theme = chosen;
				}
			} catch {
				/* Private mode, or storage turned off. Dark is a fine answer. */
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
