# Sugabots and its database, for one computer. https://sugabots.ai/install.sh
# puts this file beside a .env holding the two keys, then runs
# `docker compose up -d`. Guide: https://sugabots.ai/docs/quickstart

name: sugabots

services:
  sugabots:
    image: ghcr.io/nitrictech/sugabots:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://sugabots:sugabots@postgres:5432/sugabots
      PUBLIC_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set it in .env}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?Set it in .env}
      EMAIL_TRANSACTIONAL_FROM: Sugabots <sugabots@localhost>
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sugabots
      POSTGRES_PASSWORD: sugabots
      POSTGRES_DB: sugabots
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugabots -d sugabots"]
      interval: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
